<!DOCTYPE html>
<html lang="bn">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--sep:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--green:#34c759;--fill:rgba(118,118,128,.12);--seg:#fff;--shadow:0 1px 2px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--sep:rgba(84,84,88,.6);--blue:#0a84ff;--red:#ff453a;--green:#30d158;--fill:rgba(118,118,128,.24);--seg:#636366;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hind Siliguri","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:4px 4px 18px}
.hero{background:var(--card);border-radius:22px;padding:22px 22px 20px;margin-bottom:28px;box-shadow:var(--shadow)}
.lbl{font-size:13px;color:var(--sub);font-weight:500}
.amt{font-size:42px;font-weight:700;letter-spacing:-1px;margin-top:2px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:22px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.stats div b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.section{font-size:13px;color:var(--sub);margin:0 16px 7px;text-transform:uppercase;letter-spacing:.2px}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 16px 4px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:7px;font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--seg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.field{display:flex;align-items:center;padding:0 16px;margin-left:0;min-height:46px;position:relative}
.field+.field:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{width:96px;flex-shrink:0;font-size:16px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--text);padding:12px 0}
.field input::placeholder{color:var(--sub);opacity:.7}
.btn{display:block;width:100%;border:0;border-radius:14px;height:50px;font:inherit;font-size:17px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98);opacity:.85}.btn:disabled{opacity:.45}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.pad{padding:12px 16px 16px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;margin:0 0 10px;height:36px}
.search svg{flex-shrink:0;opacity:.5}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--text)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;position:relative;transition:background .15s}
.row:active{background:var(--fill)}
.row+.row:before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--sep)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;flex-shrink:0}
.info{flex:1;min-width:0}.info .n{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .s{font-size:13px;color:var(--sub);margin-top:1px}
.bal{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{color:var(--red)}.clear{color:var(--sub)}.adv{color:var(--green)}
.chev{color:var(--sub);opacity:.6;font-size:20px;margin-left:2px}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:15px}
.foot{text-align:center;font-size:13px;margin-top:-8px}.foot a{color:var(--blue);text-decoration:none}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:92vh;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;z-index:5}
.sheet.show{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sub);opacity:.4;margin:7px auto 0}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px}
.sh-head button{border:0;background:none;color:var(--blue);font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.sh-body{overflow-y:auto;padding:4px 16px 40px;flex:1}
.sh-title{text-align:center;margin:6px 0 22px}
.sh-title .av{width:64px;height:64px;font-size:26px;margin:0 auto 10px}
.sh-title h2{font-size:24px;font-weight:700}
.sh-title .amt{font-size:34px}
.two{display:flex;gap:10px}.two .btn{flex:1}
.tx{display:flex;align-items:center;gap:10px;padding:11px 16px;position:relative}
.tx+.tx:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.tx .info .n{font-size:16px}
.del{border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px 2px 4px 8px;opacity:.6}
.del:hover{color:var(--red);opacity:1}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;font-weight:500;transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:9;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid var(--fill);border-top-color:var(--sub);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>বাকি খাতা</h1>

  <div class="hero">
    <div class="lbl">সবার কাছে মোট পাওনা</div>
    <div class="amt" id="total">—</div>
    <div class="stats">
      <div><span class="lbl">বাকি আছে</span><b id="cDue">0 জন</b></div>
      <div><span class="lbl">মোট কাস্টমার</span><b id="cAll">0 জন</b></div>
      <div id="advBox" style="display:none"><span class="lbl">অগ্রিম</span><b id="adv" class="adv">0</b></div>
    </div>
  </div>

  <div class="section">নতুন এন্ট্রি</div>
  <div class="group">
    <div class="seg" id="seg">
      <button class="on" data-t="বাকি">+ বাকি দিলাম</button>
      <button data-t="জমা">− টাকা পেলাম</button>
    </div>
    <div class="field"><label>কাস্টমার</label><input id="name" list="names" placeholder="নাম" autocomplete="off"></div>
    <div class="field"><label>পরিমাণ</label><input id="amount" type="number" inputmode="decimal" placeholder="0" min="0" step="any"></div>
    <div class="field"><label>নোট</label><input id="note" placeholder="ঐচ্ছিক"></div>
    <div class="pad"><button class="btn" id="save">যোগ করুন</button></div>
  </div>
  <datalist id="names"></datalist>

  <div class="section">কাস্টমার</div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="খুঁজুন">
  </div>
  <div class="group" id="list"><div class="empty"><span class="spin"></span></div></div>
  <div class="foot"><a href="#" id="sheetLink" target="_blank" style="display:none">Google Sheet খুলুন ↗</a></div>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head"><span></span><button id="close">সম্পন্ন</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CUR = 'SAR';          // মুদ্রার চিহ্ন
let DATA = [], TYPE = 'বাকি', OPEN = null;
const $ = s => document.querySelector(s);
const COLORS = ['#ff9500','#ff2d55','#5856d6','#007aff','#34c759','#af52de','#5ac8fa','#ff3b30','#a2845e'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = s => s.trim().toLowerCase();
const fmt = n => CUR + ' ' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits: 2});
const color = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const av = n => `<div class="av" style="background:${color(key(n))}">${esc([...n.trim()][0] || '?').toUpperCase()}</div>`;
const dt = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + ', ' + x.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); };

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
function fail(e){ toast('⚠️ ' + (e && e.message ? e.message : e)); $('#save').disabled = false; document.querySelectorAll('.sh-body .btn').forEach(b => b.disabled = false); }

function customers(){
  const m = {};
  DATA.forEach(r => {
    const k = key(r.customer);
    const c = m[k] || (m[k] = {k, name: r.customer, bal: 0, last: '', n: 0, rows: []});
    c.bal += r.type === 'জমা' ? -r.amount : r.amount;
    c.n++; c.rows.push(r);
    if (r.date > c.last) c.last = r.date;
  });
  return Object.values(m).sort((a, b) => (b.bal > 0) - (a.bal > 0) || b.bal - a.bal || a.name.localeCompare(b.name));
}

function render(){
  const cs = customers();
  const due = cs.filter(c => c.bal > 0.0001), adv = cs.filter(c => c.bal < -0.0001);
  $('#total').textContent = fmt(due.reduce((s, c) => s + c.bal, 0));
  $('#cDue').textContent = due.length + ' জন';
  $('#cAll').textContent = cs.length + ' জন';
  $('#advBox').style.display = adv.length ? '' : 'none';
  $('#adv').textContent = fmt(adv.reduce((s, c) => s + c.bal, 0));
  $('#names').innerHTML = cs.map(c => `<option value="${esc(c.name)}">`).join('');

  const q = key($('#q').value);
  const list = cs.filter(c => !q || key(c.name).includes(q));
  $('#list').innerHTML = list.length ? list.map(c => {
    const cls = c.bal > 0.0001 ? 'due' : c.bal < -0.0001 ? 'adv' : 'clear';
    const txt = cls === 'clear' ? 'পরিশোধিত' : (cls === 'adv' ? 'অগ্রিম ' : '') + fmt(c.bal);
    return `<div class="row" data-k="${esc(c.k)}">${av(c.name)}<div class="info"><div class="n">${esc(c.name)}</div><div class="s">${c.n}টি লেনদেন · ${dt(c.last).split(',')[0]}</div></div><div class="bal ${cls}">${txt}</div><span class="chev">›</span></div>`;
  }).join('') : `<div class="empty">${DATA.length ? 'কিছু পাওয়া যায়নি' : 'এখনো কোনো এন্ট্রি নেই।<br>উপরে প্রথম বাকি যোগ করুন।'}</div>`;
  if (OPEN) renderSheet();
}

function renderSheet(){
  const c = customers().find(x => x.k === OPEN);
  if (!c) { closeSheet(); return; }
  const cls = c.bal > 0.0001 ? 'due' : c.bal < -0.0001 ? 'adv' : 'clear';
  const rows = c.rows.slice().sort((a, b) => b.date.localeCompare(a.date));
  $('#shBody').innerHTML = `
    <div class="sh-title">${av(c.name)}<h2>${esc(c.name)}</h2>
      <div class="lbl" style="margin-top:10px">${cls === 'adv' ? 'অগ্রিম জমা' : 'মোট বাকি'}</div>
      <div class="amt ${cls === 'clear' ? '' : cls}">${fmt(c.bal)}</div></div>
    <div class="group">
      <div class="field"><label>পরিমাণ</label><input id="sAmt" type="number" inputmode="decimal" placeholder="0" min="0" step="any"></div>
      <div class="field"><label>নোট</label><input id="sNote" placeholder="ঐচ্ছিক"></div>
      <div class="pad two"><button class="btn red" data-t="বাকি">+ বাকি</button><button class="btn green" data-t="জমা">− জমা</button></div>
    </div>
    <div class="section">ইতিহাস</div>
    <div class="group">${rows.map(r => `
      <div class="tx"><div class="info"><div class="n">${r.type === 'জমা' ? 'টাকা পেলাম' : 'বাকি দিলাম'}${r.note ? ' · ' + esc(r.note) : ''}</div><div class="s">${dt(r.date)}</div></div>
      <div class="bal ${r.type === 'জমা' ? 'adv' : 'due'}">${r.type === 'জমা' ? '−' : '+'}${fmt(r.amount)}</div>
      <button class="del" data-id="${esc(r.id)}" title="মুছুন">✕</button></div>`).join('')}
    </div>`;
  $('#shBody').querySelectorAll('.btn').forEach(b => b.onclick = () => {
    const amount = parseFloat($('#sAmt').value);
    if (!(amount > 0)) return toast('পরিমাণ লিখুন');
    $('#shBody').querySelectorAll('.btn').forEach(x => x.disabled = true);
    google.script.run.withSuccessHandler(d => { DATA = d; render(); toast(b.dataset.t === 'জমা' ? 'জমা হয়েছে ✓' : 'বাকি যোগ হয়েছে ✓'); })
      .withFailureHandler(fail).addEntry({customer: c.name, type: b.dataset.t, amount, note: $('#sNote').value});
  });
  $('#shBody').querySelectorAll('.del').forEach(b => b.onclick = () => {
    if (!confirm('এই এন্ট্রি মুছে ফেলবেন?')) return;
    b.disabled = true;
    google.script.run.withSuccessHandler(d => { DATA = d; render(); toast('মুছে ফেলা হয়েছে'); }).withFailureHandler(fail).deleteEntry(b.dataset.id);
  });
}

function openSheet(k){ OPEN = k; renderSheet(); $('#ov').classList.add('show'); $('#sheet').classList.add('show'); }
function closeSheet(){ OPEN = null; $('#ov').classList.remove('show'); $('#sheet').classList.remove('show'); }

$('#seg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  TYPE = b.dataset.t;
  $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('#save').className = 'btn' + (TYPE === 'জমা' ? ' green' : '');
};
$('#save').onclick = () => {
  const customer = $('#name').value.trim(), amount = parseFloat($('#amount').value);
  if (!customer) return toast('কাস্টমারের নাম লিখুন');
  if (!(amount > 0)) return toast('পরিমাণ লিখুন');
  const existing = customers().find(c => c.k === key(customer));
  $('#save').disabled = true;
  google.script.run.withSuccessHandler(d => {
    DATA = d; $('#amount').value = ''; $('#note').value = ''; $('#name').value = '';
    $('#save').disabled = false; render();
    toast(TYPE === 'জমা' ? 'জমা হয়েছে ✓' : 'বাকি যোগ হয়েছে ✓');
  }).withFailureHandler(fail).addEntry({customer: existing ? existing.name : customer, type: TYPE, amount, note: $('#note').value});
};
$('#q').oninput = render;
$('#list').onclick = e => { const r = e.target.closest('.row'); if (r) openSheet(r.dataset.k); };
$('#ov').onclick = closeSheet; $('#close').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

google.script.run.withSuccessHandler(d => { DATA = d; render(); }).withFailureHandler(fail).getData();
google.script.run.withSuccessHandler(u => { const a = $('#sheetLink'); a.href = u; a.style.display = ''; }).getSheetUrl();
</script>
</body>
</html>
