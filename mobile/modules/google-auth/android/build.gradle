plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bakikhata'
version = '1.0.0'

android {
  namespace "expo.modules.googleauth"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-auth:21.4.0"
}
